<!DOCTYPE html>
<!--
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->
<html class="theme-auto" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Autografia</title>
    <link rel="icon" type="image/x-icon" href="logos/icono.ico">

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

    <!-- Keywords -->
    <meta name="keywords" content="your name, industry, and specialties">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <link rel="stylesheet" href="littlelink/css/reset.css">
    <link rel="stylesheet" href="littlelink/css/style.css">
    <link rel="stylesheet" href="littlelink/css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="littlelink/css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->
  </head>

<body>
    <div class="container">
        <div class="column">
            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

            -->
            <img class="avatar avatar--soft" src="logos/icono.png" srcset="logos/icono@2x.png 2x" alt="Autografia" style="filter: invert(1);">

            <h1>
              <div>Autografia</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>An open source DIY Linktree alternative.</p>

            <div class="button-stack" role="navigation">

              <!-- Behance 
              <a class="button button-behance" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/behance.svg" alt="Behance Logo">Behance</a>-->

              <!-- Generic Website -->
              <a class="button button-default" href="https://autografia.github.io" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/generic-website.svg" alt="Website Icon">Visita nuestro Portfolio</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://instagram.com/autografia_fotografia" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://tiktok.com/@autografia_fotografia" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

              <!-- Generic Email -->
              <a class="button button-default" href="mailto:autografia.fotografia@gmail.com?subject=Consulta%20Web&body=Hola,%20quiero%20más%20información." role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/generic-email.svg" alt="Email Icon">Manda un Correo</a>
              
              <!-- Facebook -->
              <a class="button button-faceb" href="https://www.facebook.com/profile.php?id=61579317359564" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/facebook.svg" alt="Facebook Logo">Facebook</a>

              <!-- Google Drive 
              <a class="button button-google-black" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="littlelink/images/icons/google-drive.svg" alt="Google Drive Logo">Ver en Google Drive</a>-->
      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>-->

    </div>
  </div>

</body>

</html>
